<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ratil.saher - رتّل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>رتّل - Ratil.saher</h1>
    
    <div class="controls">
      <!-- اختيار السورة -->
      <select id="surah">
        <option value="1">الفاتحة</option>
        <option value="2">البقرة</option>
        <option value="3">آل عمران</option>
        <option value="48">الفتح</option>
        <option value="112">الإخلاص</option>
        <option value="113">الفلق</option>
        <option value="114">الناس</option>
      </select>

      <!-- زر التشغيل اليدوي -->
      <button id="start" class="btn-start">Start بدء الاستماع</button>

      <!-- تفعيل التجويد -->
      <label class="tjw-label">
        <input type="checkbox" id="tjw">
        أحكام التجويد
      </label>
    </div>
  </header>

  <main class="content-container">
    <div id="msg" class="status-msg">اضغط على Start للبدء وتلاوة الآيات...</div>
    <div id="text" class="quran-text"></div>
  </main>

  <script src="tajweed.js"></script>
  <script src="recognition.js"></script>
  <script src="main.js"></script>
</body>
</html>
